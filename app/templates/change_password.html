{% extends "base.html" %}
{% block title %}Alterar Password{% endblock %}

{% block content %}
  <div class="page" style="max-width:480px">
    <a href="/" class="back">← Voltar</a>
    <h1>Alterar Password</h1>

    <div class="card">
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      {% if success %}
      <div class="alert alert-success">{{ success }}</div>
      {% endif %}

      <form method="post">
        <div class="form-group">
          <label>Password atual</label>
          <input type="password" name="current_password" required autofocus>
        </div>
        <div class="form-group">
          <label>Nova password</label>
          <input type="password" name="new_password" required minlength="8">
        </div>
        <div class="form-group">
          <label>Confirmar nova password</label>
          <input type="password" name="confirm_password" required minlength="8">
        </div>
        <button type="submit" class="btn" style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Guardar nova password</button>
      </form>
    </div>
  </div>
{% endblock %}
